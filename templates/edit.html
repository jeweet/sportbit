{% extends "base.html" %}

{% block content %}

<div class="page-title">
    <h1>
        {% if nieuw %}
            Nieuwe les
        {% else %}
            Les bewerken
        {% endif %}
    </h1>

    <p>
        Kies een dag en selecteer vervolgens de gewenste les voor automatisch inschrijven.
    </p>
</div>


<section class="card form-card">

    <form method="post" id="lesson-form">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <!-- DAG -->

        <label for="dag">
            Dag
        </label>

        <select
            id="dag"
            name="dag"
            required
        >

            {% for dag in dagen %}

                <option
                    value="{{ dag }}"
                    {% if item.dag == dag %}
                        selected
                    {% endif %}
                >
                    {{ dag|capitalize }}
                </option>

            {% endfor %}

        </select>


        <!--
            Deze waarden worden door sportbit.js
            gevuld wanneer een les wordt geselecteerd.
        -->

        <input
            type="hidden"
            id="tijd"
            name="tijd"
            value="{{ item.tijd|default('', true) }}"
        >

        <input
            type="hidden"
            id="les"
            name="les"
            value="{{ item.les|default('', true) }}"
        >


        <!-- LES -->

        <label class="form-label">
            Les
        </label>

        <div
            id="lesson-options"
            class="lesson-choices"
            role="radiogroup"
            aria-label="Beschikbare lessen"
        >
            <p class="lesson-choice-message">
                Lessen laden...
            </p>
        </div>
        <!-- STATUS --> 
        <p id="lessen-status" class="form-help" aria-live="polite" ></p>

        <!-- ACTIES -->

        <div class="form-actions">

            <a
                href="{{ url_for('index') }}"
                class="button"
            >
                Annuleren
            </a>

            <button
                type="submit"
                class="button button-primary"
            >
                Opslaan
            </button>

        </div>

    </form>

</section>

{% endblock %}
