{% extends "base.html" %}

{% block content %}

<script src="{{ url_for('static', filename='js/edit.js') }}" defer ></script> <div class="page-title">
<h1>
    {% if nieuw %}
        Toevoegen
    {% else %}
        Bewerken
    {% endif %}
</h1>

<p>
    {% if nieuw %}
        Nieuwe automatische SportBit-inschrijving
    {% else %}
        SportBit-inschrijving aanpassen
    {% endif %}
</p>

</div> <section class="card form-card">
<form method="post">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >


    <label for="dag">
        Dag
    </label>

    <select
        id="dag"
        name="dag"
        required
    >

        {% for dag in dagen %}

            <option
                value="{{ dag }}"
                {% if item.dag == dag %}selected{% endif %}
            >
                {{ dag|capitalize }}
            </option>

        {% endfor %}

    </select>


    <label for="tijd">
        Tijd
    </label>

    <select
        id="tijd"
        name="tijd"
        required
        data-current-tijd="{{ item.tijd }}"
    >

        <option value="">
            Kies eerst een dag...
        </option>

    </select>


    <label for="les">
        Les
    </label>

    <select
        id="les"
        name="les"
        required
        data-current-les="{{ item.les }}"
    >

        <option value="">
            Voer dag en tijd in...
        </option>

        {% if item.les %}

            <option
                value="{{ item.les }}"
                selected
            >
                {{ item.les }}
            </option>

        {% endif %}

    </select>


    <p
        id="lessen-status"
        class="form-help"
        aria-live="polite"
    ></p>


    <div class="form-actions">

        <a
            href="{{ url_for('index') }}"
            class="button"
        >
            Annuleren
        </a>

        <button
            type="submit"
            class="button button-primary"
        >
            Opslaan
        </button>

    </div>

</form>

</section>

{% endblock %}
